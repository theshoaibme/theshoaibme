version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - frontend

  - package-ecosystem: npm
    directory: /workers/contact-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      worker-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - worker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
